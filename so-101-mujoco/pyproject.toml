[project]
name = "so-101-mujoco"
version = "0.1.0"
description = "Quickstart simulation environment for the SO-101 (SO-ARM101) 6-DOF Robot Arm using MuJoCo and MuJoCo Warp"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Juan Esteban Camacho", email = "johannstephan239@gmail.com" }
]
license = { text = "Apache-2.0" }
keywords = ["robotics", "mujoco", "mujoco-warp", "so-101", "lerobot", "huggingface", "simulation", "reinforcement-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mujoco>=3.2.0",
    "mujoco-warp>=0.1.0",
    "warp-lang>=1.0.0",
    "numpy>=1.26.0",
    "gymnasium>=0.29.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["so101"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"
